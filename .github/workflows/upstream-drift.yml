name: Upstream drift (hermes Python → hermes-core Rust)

# Surfaces upstream changes in paths we actively track (see
# agent-core-rs/UPSTREAM_PATHS.md). Runs weekly so drift is found early,
# not when someone tries to debug a broken wire format months later.

on:
  schedule:
    - cron: "0 9 * * 1"    # Mondays 09:00 UTC
  workflow_dispatch:        # manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - "agent-core-rs/UPSTREAM_REV"
      - "agent-core-rs/UPSTREAM_PATHS.md"
      - "agent-core-rs/scripts/upstream-diff.sh"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need full history for `git log <pin>..HEAD`

      - name: Run upstream-diff
        id: diff
        run: |
          set -euo pipefail
          cd agent-core-rs
          # Capture human-readable diff for the issue body
          ./scripts/upstream-diff.sh > /tmp/drift.txt 2>&1 || true
          files=$(./scripts/upstream-diff.sh --files-only 2>/dev/null | grep -v '^#' | grep -v '^$' || true)
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$files" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          # Drift = any tracked file appeared in the window
          if [ -n "$files" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
          # GitHub issue bodies cap at 65536 chars; truncate the diff to fit
          # alongside our boilerplate.
          head -c 50000 /tmp/drift.txt > /tmp/drift-trimmed.txt
          {
            echo "diff<<DIFF_EOF"
            cat /tmp/drift-trimmed.txt
            if [ "$(wc -c < /tmp/drift.txt)" -gt 50000 ]; then
              echo
              echo "[diff truncated to 50KB — run \`./agent-core-rs/scripts/upstream-diff.sh\` locally for the full output]"
            fi
            echo "DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update drift issue
        if: steps.diff.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[upstream-drift] tracked-path changes detected';
            const files = `${{ steps.diff.outputs.files }}`.trim();
            const diff = `${{ steps.diff.outputs.diff }}`;
            const body = [
              '> Auto-generated by `.github/workflows/upstream-drift.yml`.',
              '',
              'Upstream Python hermes touched paths we track for the Rust port.',
              'Review the diffs below; port what affects wire format or core',
              'behavior; ignore noise; then bump the pin:',
              '',
              '```sh',
              './agent-core-rs/scripts/upstream-diff.sh --bump <new-sha>',
              '```',
              '',
              '## Changed tracked files',
              '',
              '```',
              files || '(none)',
              '```',
              '',
              '## Diff',
              '',
              '```diff',
              diff,
              '```',
            ].join('\n');

            // Look for an existing open drift issue to update in place.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-drift',
              per_page: 5,
            });
            if (existing.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
              core.notice(`Updated existing drift issue #${existing[0].number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-drift'],
              });
              core.notice(`Opened drift issue #${created.number}`);
            }

      - name: No drift
        if: steps.diff.outputs.drift != 'true'
        run: echo "No tracked-path drift since UPSTREAM_REV. We're up to date."
